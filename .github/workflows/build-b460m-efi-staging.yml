name: Build B460M OpenCore staging EFI

on:
  workflow_dispatch:
  push:
    paths:
      - "B460M-OC-Builder/EFI/EFI/OC/ACPI/**"
      - "B460M-OC-Builder/build_b460m_config.py"
      - "UTBMap.kext.rar"
      - ".github/workflows/build-b460m-efi-staging.yml"

permissions:
  contents: read

# Keep staging builds independent; never cancel an in-progress EFI validation run.
concurrency:
  group: b460m-opencore-staging-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-staging:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ACPICA compiler
        run: |
          brew install acpica unar

      - name: Prepare EFI directory structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/EFI/BOOT
          mkdir -p build/EFI/OC/ACPI
          mkdir -p build/EFI/OC/Drivers
          mkdir -p build/EFI/OC/Tools
          mkdir -p build/EFI/OC/Kexts
          mkdir -p build/Tools

      - name: Download and verify OpenCore 1.0.8 DEBUG
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.8/OpenCore-1.0.8-DEBUG.zip"
          curl --fail --location --retry 3 "$url" -o /tmp/OpenCore-1.0.8-DEBUG.zip
          echo "3F5F42B85703CF2C08E8DCD9245A52FB4326C9F4EF335C75B49F516CBBE131C6  /tmp/OpenCore-1.0.8-DEBUG.zip" | shasum -a 256 --check -
          mkdir -p /tmp/opencore
          unzip -q /tmp/OpenCore-1.0.8-DEBUG.zip -d /tmp/opencore
          test -s /tmp/opencore/X64/EFI/BOOT/BOOTx64.efi
          test -s /tmp/opencore/X64/EFI/OC/OpenCore.efi
          test -s /tmp/opencore/X64/EFI/OC/Drivers/OpenRuntime.efi
          test -s /tmp/opencore/X64/EFI/OC/Tools/OpenShell.efi
          cp /tmp/opencore/X64/EFI/BOOT/BOOTx64.efi build/EFI/BOOT/
          cp /tmp/opencore/X64/EFI/OC/OpenCore.efi build/EFI/OC/
          cp /tmp/opencore/X64/EFI/OC/Drivers/OpenRuntime.efi build/EFI/OC/Drivers/
          cp /tmp/opencore/X64/EFI/OC/Tools/OpenShell.efi build/EFI/OC/Tools/
          cp /tmp/opencore/Docs/Sample.plist build/Tools/OpenCore-1.0.8-Sample.plist
          shasum -a 256 build/EFI/BOOT/BOOTx64.efi build/EFI/OC/OpenCore.efi build/EFI/OC/Drivers/OpenRuntime.efi build/EFI/OC/Tools/OpenShell.efi

      - name: Download HfsPlus driver from pinned commit
        shell: bash
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/acidanthera/OcBinaryData/640e7e9240938f2529e725351e1e1150dc3569db/Drivers/HfsPlus.efi"
          curl --fail --location --retry 3 "$url" -o build/EFI/OC/Drivers/HfsPlus.efi
          echo "A55B5FFF36578864BA6792C4C6369C71F6F35B61DD5A853DDF8583CD36C31D8F  build/EFI/OC/Drivers/HfsPlus.efi" | shasum -a 256 --check -

      - name: Download and stage required kext releases
        shell: bash
        run: |
          set -euo pipefail
          stage_kext() {
            local name="$1" version="$2" url="$3" bundle="$4"
            local zip="/tmp/${name}-${version}.zip"
            local dest="build/EFI/OC/Kexts/${bundle}"
            curl --fail --location --retry 3 "$url" -o "$zip"
            mkdir -p "/tmp/kext-${name}"
            unzip -q "$zip" -d "/tmp/kext-${name}"
            count="$(find "/tmp/kext-${name}" -type d -name "$bundle" -print | wc -l | tr -d " ")"
            if [ "$count" -ne 1 ]; then
              echo "Expected exactly one $bundle in $name archive; found $count" >&2
              exit 1
            fi
            found="$(find "/tmp/kext-${name}" -type d -name "$bundle" -print -quit)"
            test -s "$found/Contents/Info.plist"
            cp -a "$found" "$dest"
            echo "STAGED: $bundle $version"
          }
          stage_kext Lilu 1.7.2 https://github.com/acidanthera/Lilu/releases/download/1.7.2/Lilu-1.7.2-RELEASE.zip Lilu.kext
          stage_kext VirtualSMC 1.3.8 https://github.com/acidanthera/VirtualSMC/releases/download/1.3.8/VirtualSMC-1.3.8-RELEASE.zip VirtualSMC.kext
          stage_kext WhateverGreen 1.7.1 https://github.com/acidanthera/WhateverGreen/releases/download/1.7.1/WhateverGreen-1.7.1-RELEASE.zip WhateverGreen.kext
          stage_kext AppleALC 1.9.8 https://github.com/acidanthera/AppleALC/releases/download/1.9.8/AppleALC-1.9.8-RELEASE.zip AppleALC.kext
          stage_kext IntelMausi 1.0.8 https://github.com/acidanthera/IntelMausi/releases/download/1.0.8/IntelMausi-1.0.8-RELEASE.zip IntelMausi.kext
          stage_kext NVMeFix 1.1.3 https://github.com/acidanthera/NVMeFix/releases/download/1.1.3/NVMeFix-1.1.3-RELEASE.zip NVMeFix.kext
          stage_kext USBToolBox 1.2.0 https://github.com/USBToolBox/kext/releases/download/1.2.0/USBToolBox-1.2.0-RELEASE.zip USBToolBox.kext
          echo "c315a3a5acfd496dd97d0d19b4fbd1d487103d2fd541c5651583d4c9cebcfe07  /tmp/USBToolBox-1.2.0.zip" | shasum -a 256 --check -
          # Extract the user's original RAR on the runner; never substitute a reconstructed plist.
          mkdir -p /tmp/utbmap-source
          unar -quiet -force-overwrite -output-directory /tmp/utbmap-source UTBMap.kext.rar
          source_plist="$(find /tmp/utbmap-source -path '*/UTBMap.kext/Contents/Info.plist' -print -quit)"
          test -n "$source_plist"
          test -s "$source_plist"
          mkdir -p build/EFI/OC/Kexts/UTBMap.kext/Contents
          cp "$source_plist" build/EFI/OC/Kexts/UTBMap.kext/Contents/Info.plist
          cp "$source_plist" B460M-OC-Builder/EFI/EFI/OC/Kexts/UTBMap.kext/Contents/Info.plist
          shasum -a 256 "$source_plist" build/EFI/OC/Kexts/UTBMap.kext/Contents/Info.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("build/EFI/OC/Kexts/UTBMap.kext/Contents/Info.plist")
          m = plistlib.loads(p.read_bytes())
          assert m["CFBundleIdentifier"] == "com.dhinakg.USBToolBox.map"
          assert m["OSBundleLibraries"]["com.dhinakg.USBToolBox.kext"] == "1.0.0"
          ports = m["IOKitPersonalities"]["XHC"]["IOProviderMergeProperties"]["ports"]
          assert len(ports) == 11
          assert int.from_bytes(m["IOKitPersonalities"]["XHC"]["IOProviderMergeProperties"]["port-count"], "little") == 20
          assert len(ports) <= 15, "Apple XHCI port limit exceeded"
          print("UTBMap plist verified: 11 mapped ports; highest hardware index 20")
          PY

      - name: Verify staged kext metadata and x86_64 executables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          import subprocess
          from pathlib import Path

          root = Path("build/EFI/OC/Kexts")
          expected = {
              "Lilu.kext": ("as.vit9696.Lilu", "1.7.2", "Contents/MacOS/Lilu"),
              "VirtualSMC.kext": ("as.vit9696.VirtualSMC", "1.3.8", "Contents/MacOS/VirtualSMC"),
              "WhateverGreen.kext": ("as.vit9696.WhateverGreen", "1.7.1", "Contents/MacOS/WhateverGreen"),
              "AppleALC.kext": ("as.vit9696.AppleALC", "1.9.8", "Contents/MacOS/AppleALC"),
              "IntelMausi.kext": ("as.acidanthera.mieze.IntelMausi", "1.0.8", "Contents/MacOS/IntelMausi"),
              "NVMeFix.kext": ("org.acidanthera.NVMeFix", "1.1.3", "Contents/MacOS/NVMeFix"),
              "USBToolBox.kext": ("com.dhinakg.USBToolBox.kext", "1.2.0", "Contents/MacOS/USBToolBox"),
          }
          for bundle, (bundle_id, version, executable) in expected.items():
              info = root / bundle / "Contents/Info.plist"
              meta = plistlib.loads(info.read_bytes())
              assert meta["CFBundleIdentifier"] == bundle_id, (bundle, meta.get("CFBundleIdentifier"))
              assert meta["CFBundleVersion"] == version, (bundle, meta.get("CFBundleVersion"))
              binary = root / bundle / executable
              assert binary.is_file() and binary.stat().st_size > 0, str(binary)
              subprocess.run(["lipo", str(binary), "-verify_arch", "x86_64"], check=True)
              print(f"PASS: {bundle} {version} x86_64")
          utb = plistlib.loads((root / "UTBMap.kext/Contents/Info.plist").read_bytes())
          assert utb["CFBundleIdentifier"] == "com.dhinakg.USBToolBox.map"
          assert utb["CFBundleVersion"] == "1.1"
          assert utb["OSBundleLibraries"]["com.dhinakg.USBToolBox.kext"] == "1.0.0"
          assert not (root / "UTBMap.kext/Contents/MacOS").exists()
          print("PASS: UTBMap 1.1 codeless dependency metadata")
          PY

      # USBToolBox 1.2.0 handles the broken 400-series RHUB ACPI path;
      # do not inject the separate SSDT-RHUB when using UTBMap.
      - name: Copy verified repository ACPI tables
        shell: bash
        run: |
          set -euo pipefail
          src="B460M-OC-Builder/EFI/EFI/OC/ACPI"
          for file in SSDT-PLUG-DRTNIA.aml SSDT-EC-USBX-DESKTOP.aml SSDT-AWAC.aml; do
            test -s "$src/$file"
            cp "$src/$file" build/EFI/OC/ACPI/
          done
          ls -lh build/EFI/OC/ACPI

      - name: Disassemble and sanity-check staged ACPI AML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b460m-acpi-disassembly
          for name in SSDT-PLUG-DRTNIA SSDT-EC-USBX-DESKTOP SSDT-AWAC; do
            aml="$GITHUB_WORKSPACE/build/EFI/OC/ACPI/$name.aml"
            test -s "$aml"
            cp "$aml" "/tmp/b460m-acpi-disassembly/$name.aml"
            (cd /tmp/b460m-acpi-disassembly && iasl -d "$name.aml")
            dsl="/tmp/b460m-acpi-disassembly/$name.dsl"
            test -s "$dsl"
            grep -q "DefinitionBlock" "$dsl"
            echo "PASS: $name.aml disassembled and parsed by ACPICA"
          done

      - name: Build and validate hardware-specific config.plist candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 B460M-OC-Builder/build_b460m_config.py \
            build/Tools/OpenCore-1.0.8-Sample.plist \
            build/EFI/OC/config.plist \
            build/EFI/OC
          validator="$(find /tmp/opencore -type f -name ocvalidate -print -quit)"
          test -n "$validator"
          chmod +x "$validator"
          "$validator" build/EFI/OC/config.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p = Path("build/EFI/OC/config.plist")
          with p.open("rb") as f:
              c = plistlib.load(f)
          assert c["PlatformInfo"]["Generic"]["SystemProductName"] == "iMac20,1"
          assert c["Misc"]["Security"]["BlacklistAppleUpdate"] is True
          assert c["PlatformInfo"]["Generic"]["SystemSerialNumber"] == "C02J5NYBPN5T"
          assert c["PlatformInfo"]["Generic"]["MLB"] == "C02231609GUPHC1JC"
          assert c["PlatformInfo"]["Generic"]["SystemUUID"] == "78BDA777-E7DE-493E-BB3C-DE76B4D3AEE6"
          assert c["PlatformInfo"]["Generic"]["ROM"] == bytes.fromhex("3c7c3fd77ee8")
          assert c["Booter"]["Quirks"]["DevirtualiseMmio"] is True
          assert c["Booter"]["Quirks"]["SetupVirtualMap"] is False
          assert c["Booter"]["Quirks"]["ProtectUefiServices"] is True
          expected_kexts = [
              "Lilu.kext", "VirtualSMC.kext", "WhateverGreen.kext", "AppleALC.kext",
              "IntelMausi.kext", "NVMeFix.kext", "USBToolBox.kext", "UTBMap.kext",
          ]
          assert [x["BundlePath"] for x in c["Kernel"]["Add"]] == expected_kexts
          assert all(x["Enabled"] and x["Arch"] == "x86_64" and x["PlistPath"] == "Contents/Info.plist" for x in c["Kernel"]["Add"])
          assert c["Kernel"]["Add"][-2]["ExecutablePath"] == "Contents/MacOS/USBToolBox"
          assert c["Kernel"]["Add"][-1]["ExecutablePath"] == ""
          assert c["Kernel"]["Add"][-2]["Enabled"] and c["Kernel"]["Add"][-1]["Enabled"]
          assert c["Kernel"]["Quirks"]["XhciPortLimit"] is False
          assert c["Kernel"]["Quirks"]["DisableIoMapper"] is False
          assert c["Kernel"]["Quirks"]["AppleXcpmCfgLock"] is True
          expected_acpi = ["SSDT-PLUG-DRTNIA.aml", "SSDT-EC-USBX-DESKTOP.aml", "SSDT-AWAC.aml"]
          assert [x["Path"] for x in c["ACPI"]["Add"]] == expected_acpi
          assert all(x["Enabled"] for x in c["ACPI"]["Add"])
          assert all((Path("build/EFI/OC/ACPI") / x["Path"]).is_file() for x in c["ACPI"]["Add"])
          assert all(x["Path"] != "SSDT-RHUB-B460M-PLUS.aml" for x in c["ACPI"]["Add"])
          expected_drivers = ["OpenRuntime.efi", "HfsPlus.efi"]
          assert [x["Path"] for x in c["UEFI"]["Drivers"]] == expected_drivers
          assert all(x["Enabled"] and (Path("build/EFI/OC/Drivers") / x["Path"]).is_file() for x in c["UEFI"]["Drivers"])
          assert c["NVRAM"]["Add"]["7C436110-AB2A-4BBB-A880-FE41995C9F82"]["boot-args"].startswith("-v ")
          # Graphics/network/storage/audio/CPU initialization guardrails from the hardware audit.
          assert list(c["DeviceProperties"]["Add"]) == ["PciRoot(0x0)/Pci(0x2,0x0)"]
          igpu = c["DeviceProperties"]["Add"]["PciRoot(0x0)/Pci(0x2,0x0)"]
          assert igpu == {"AAPL,ig-platform-id": bytes.fromhex("0300C89B")}
          assert c["DeviceProperties"]["Delete"] == {}
          boot_args = c["NVRAM"]["Add"]["7C436110-AB2A-4BBB-A880-FE41995C9F82"]["boot-args"]
          for forbidden in ("agdpmod=pikera", "-wegnoegpu", "alcid=", "cpus=1", "nvmefaspm"):
              assert forbidden not in boot_args, f"Unjustified boot argument present: {forbidden}"
          assert "NVMeFix.kext" in [x["BundlePath"] for x in c["Kernel"]["Add"]]
          assert c["Kernel"]["Emulate"]["Cpuid1Data"] == b""
          assert c["Kernel"]["Emulate"]["Cpuid1Mask"] == b""
          print("Hardware guardrails passed: RX 570 remains enabled; UHD 630 headless only; no speculative audio/ASPM/CPU spoof")
          print(f"config.plist parsed and cross-checked against staged files: {p.stat().st_size} bytes")
          PY

      - name: Produce staging manifest and safety notice
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# B460M OpenCore staging build"
            echo
            echo "- OpenCore: 1.0.8 DEBUG"
            echo "- Kexts: Lilu 1.7.2; VirtualSMC 1.3.8; WhateverGreen 1.7.1; AppleALC 1.9.8; IntelMausi 1.0.8; NVMeFix 1.1.3; USBToolBox 1.2.0; UTBMap 1.1"
            echo "- ACPI: PLUG, EC-USBX, AWAC; USBToolBox handles RHUB removal"
            echo "- Drivers: OpenRuntime.efi and HfsPlus.efi"
            echo "- Config: hardware-specific config.plist candidate generated and checked with matching ocvalidate"
            echo "- Status: STAGING ONLY; NOT BOOTABLE"
            echo
            echo "The config.plist includes the user's requested TEMPORARY TEST SMBIOS identity for initial bring-up only. Replace it locally with a fresh matching GenSMBIOS set after testing."
            echo "The supplied UTBMap is staged but physical port-by-port behavior still requires validation. No installer, disk image, or physical EFI write is included."
            echo
            echo "## SHA-256"
            shasum -a 256 build/EFI/BOOT/BOOTx64.efi build/EFI/OC/OpenCore.efi build/EFI/OC/Drivers/*.efi build/EFI/OC/ACPI/*.aml
          } > build/BUILD-MANIFEST.md
          cat > build/DO-NOT-BOOT.txt <<'EOF'
          This is an incomplete staging EFI, not a bootable OpenCore configuration.
          A hardware-specific config.plist candidate is included, but it is not approved
          for booting. The supplied UTBMap is staged; physical port-by-port behavior
          and real-hardware validation are still outstanding.
          Do not use this artifact to boot or install macOS. No disk image or physical EFI write is included.
          EOF
          test -s build/EFI/OC/config.plist

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: B460M-OpenCore-1.0.8-DEBUG-STAGING-NOT-BOOTABLE
          path: build/
          if-no-files-found: error
          retention-days: 14
