name: Build B460M no-SS04 diagnostic EFI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-b460m-no-ss04-diagnostic.yml"
      - "B460M-OC-Builder/Panic-Diagnosis-USB-SS04-2026-11-25.md"

permissions:
  actions: read
  contents: read

jobs:
  diagnostic-efi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download last fully validated EFI artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 45609013025 \
            --repo "${GITHUB_REPOSITORY}" \
            --name "B460M-OpenCore-1.0.8-DEBUG-USB-BOOT-TEST-CANDIDATE" \
            --dir base
          test -s base/EFI/OC/config.plist
          test -s base/EFI/OC/Kexts/UTBMap.kext/Contents/Info.plist
          test -s base/EFI/BOOT/BOOTx64.efi
          cp -a base build

      - name: Patch only the failing USB port pair and panic diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          root = Path("build/EFI/OC")
          mp = root / "Kexts/UTBMap.kext/Contents/Info.plist"
          m = plistlib.loads(mp.read_bytes())
          ports = m["IOKitPersonalities"]["XHC"]["IOProviderMergeProperties"]["ports"]
          removed = {name: ports.pop(name) for name in ("HS04", "SS04")}
          assert int.from_bytes(removed["HS04"]["port"], "little") == 4
          assert int.from_bytes(removed["SS04"]["port"], "little") == 20
          assert set(ports) == {"HS01","HS02","HS03","HS05","HS06","HS07","SS01","SS02","SS03"}
          mp.write_bytes(plistlib.dumps(m, fmt=plistlib.FMT_XML, sort_keys=True))

          cp = root / "config.plist"
          c = plistlib.loads(cp.read_bytes())
          c["Kernel"]["Quirks"]["PanicNoKextDump"] = False
          assert c["Misc"]["Security"]["ScanPolicy"] == 0x00200703
          assert c["Misc"]["Boot"]["Timeout"] == 0
          assert c["PlatformInfo"]["Generic"]["SystemProductName"] == "iMac20,1"
          cp.write_bytes(plistlib.dumps(c, fmt=plistlib.FMT_XML, sort_keys=True))
          print("PATCH_OK: disabled HS04(index 4)+SS04(index 20); PanicNoKextDump=false")
          PY

      - name: Validate with matching OpenCore 1.0.8 ocvalidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.8/OpenCore-1.0.8-DEBUG.zip" \
            -o /tmp/OpenCore-1.0.8-DEBUG.zip
          echo "3F5F42B85703CF2C08E8DCD9245A52FB4326C9F4EF335C75B49F516CBBE131C6  /tmp/OpenCore-1.0.8-DEBUG.zip" | sha256sum --check -
          mkdir -p /tmp/oc
          unzip -q /tmp/OpenCore-1.0.8-DEBUG.zip -d /tmp/oc
          validator="$(find /tmp/oc -type f -name ocvalidate -print -quit)"
          test -n "$validator"
          chmod +x "$validator"
          "$validator" build/EFI/OC/config.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          root=Path("build/EFI/OC")
          m=plistlib.loads((root/"Kexts/UTBMap.kext/Contents/Info.plist").read_bytes())
          ports=m["IOKitPersonalities"]["XHC"]["IOProviderMergeProperties"]["ports"]
          assert len(ports)==9 and "HS04" not in ports and "SS04" not in ports
          c=plistlib.loads((root/"config.plist").read_bytes())
          assert c["Kernel"]["Quirks"]["PanicNoKextDump"] is False
          assert c["Misc"]["Security"]["ScanPolicy"]==0x00200703
          assert c["Misc"]["Boot"]["Timeout"]==0
          assert [x["BundlePath"] for x in c["Kernel"]["Add"]][-2:]==["USBToolBox.kext","UTBMap.kext"]
          assert all((root/"Kexts"/x["BundlePath"]).exists() for x in c["Kernel"]["Add"])
          assert all((root/"ACPI"/x["Path"]).exists() for x in c["ACPI"]["Add"])
          assert all((root/"Drivers"/x["Path"]).exists() for x in c["UEFI"]["Drivers"])
          print("PASS: no-SS04 map, kexts, ACPI, drivers, USB-only ScanPolicy, manual picker")
          PY

      - name: Produce manifest and EFI ZIP
        run: |
          set -euo pipefail
          {
            echo "# B460M no-SS04 diagnostic EFI"
            echo "- Base: previously validated OpenCore 1.0.8 DEBUG EFI artifact"
            echo "- Disabled: HS04 index 4 and SS04 index 20 only"
            echo "- PanicNoKextDump=false"
            echo "- USBToolBox RHUB handling retained"
            echo "- ScanPolicy=0x00200703; internal SATA/NVMe remain excluded"
            echo "- Hardware test is still required; not represented as hardware-verified"
            echo
            find build/EFI -type f -print0 | sort -z | xargs -0 sha256sum
          } > build/BUILD-MANIFEST.md
          cat > build/USB-DIAGNOSTIC-README.txt <<'EOF'
          B460M TARGETED USB DIAGNOSTIC EFI
          Based on the previously validated OpenCore 1.0.8 DEBUG EFI.
          Disabled only HS04 (hardware index 4) and SS04 (hardware index 20).
          The panic screenshots show SS04@14b00000 enumeration failures and
          a Genesys Logic 05e3:0610 USB2.1 hub before Apple USB/IOKit heap
          corruption. USBToolBox remains enabled for Intel 400-series RHUB.
          PanicNoKextDump=false preserves better panic diagnostics.
          ScanPolicy remains USB-only; internal NVMe/SATA scanning stays disabled.
          If the recovery USB itself is attached through the disabled port pair,
          it may disappear after macOS takes over USB. No disk is formatted.
          EOF
          cd build
          zip -qr ../B460M-no-SS04-Diagnostic-EFI.zip EFI BUILD-MANIFEST.md USB-DIAGNOSTIC-README.txt
          cd ..
          unzip -t B460M-no-SS04-Diagnostic-EFI.zip
          sha256sum B460M-no-SS04-Diagnostic-EFI.zip

      - name: Upload targeted diagnostic EFI
        uses: actions/upload-artifact@v4
        with:
          name: B460M-OpenCore-1.0.8-DEBUG-USB-NO-SS04-DIAGNOSTIC
          path: |
            B460M-no-SS04-Diagnostic-EFI.zip
            build/
          if-no-files-found: error
          retention-days: 14
