name: B460M OpenCore 1.0.5 AppleInput protocol diagnostics

on:
  push:
    branches:
      - opencore-1.0.5-sequoia-rx570
    paths:
      - ".github/workflows/build-b460m-oc105-appleinput-diagnostics.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile:
          - name: BUILTIN_MIRROR_OFF
            apple_event: Builtin
            mirroring: false
          - name: BUILTIN_MIRROR_ON
            apple_event: Builtin
            mirroring: true
          - name: AUTO_MIRROR_OFF
            apple_event: Auto
            mirroring: false
          - name: AUTO_MIRROR_ON
            apple_event: Auto
            mirroring: true
    name: ${{ matrix.profile.name }}
    env:
      APPLE_EVENT: ${{ matrix.profile.apple_event }}
      MIRRORING: ${{ matrix.profile.mirroring }}
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned baseline and official OpenCore 1.0.5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15063694125/zip -o baseline.zip
          echo "f799c3b0be0a619230e1301f657f553e9f5db7edd7bd91ac9a4820c47442c38f  baseline.zip" | sha256sum --check
          mkdir baseline
          unzip -oq baseline.zip -d baseline
          curl --fail --location --retry 3 https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.5/OpenCore-1.0.5-DEBUG.zip -o OpenCore-1.0.5-DEBUG.zip
          echo "db0720000455502b34ad5a0fc53114f7cd6d388bc6af7636e8a530276a6bf0a1  OpenCore-1.0.5-DEBUG.zip" | sha256sum --check
          curl --fail --location --retry 3 https://raw.githubusercontent.com/acidanthera/OcBinaryData/c2a98980d30e39a571a2843ab26aa8d2b9188094/Drivers/HfsPlus.efi -o HfsPlus.efi
          mkdir official
          unzip -oq OpenCore-1.0.5-DEBUG.zip -d official
          validator="$(find official -type f -name ocvalidate.linux -print -quit)"
          test -n "$validator"
          chmod +x "$validator"
          echo "OCVALIDATE=$validator" >> "$GITHUB_ENV"
      - name: Compare deployed boot chain binaries with official OpenCore 1.0.5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          baseline_configs=list(Path("baseline").glob("**/OC/config.plist"))
          assert len(baseline_configs)==1,baseline_configs
          oc=baseline_configs[0].parent
          efi=oc.parent
          checks={
            "BOOT/BOOTx64.efi": "BOOTx64.efi",
            "OC/OpenCore.efi": "OpenCore.efi",
            "OC/Drivers/OpenRuntime.efi": "OpenRuntime.efi",
          }
          official_efi=Path("official/X64/EFI")
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          for deployed_rel, name in checks.items():
              deployed=efi/deployed_rel
              official=official_efi/("BOOT/"+name if deployed_rel.startswith("BOOT/") else "OC/"+("Drivers/"+name if "/Drivers/" in deployed_rel else name))
              assert deployed.is_file(),f"DEPLOYED_MISSING: {deployed_rel}"
              assert official.is_file(),f"OFFICIAL_X64_MISSING: {official}"
              a,b=sha(deployed),sha(official)
              print(f"{deployed_rel}: deployed={a} official={b}")
              if a!=b:
                  raise SystemExit(f"BINARY_VERSION_MISMATCH: {deployed_rel}")
          hfs=efi/"OC/Drivers/HfsPlus.efi"
          assert hfs.is_file(),"DEPLOYED_MISSING: OC/Drivers/HfsPlus.efi"
          source=Path("HfsPlus.efi")
          assert source.is_file(),"PINNED_OCBINARYDATA_HFSPLUS_DOWNLOAD_MISSING"
          deployed_hash,source_hash=sha(hfs),sha(source)
          print(f"HfsPlus.efi: deployed={deployed_hash} pinned_OcBinaryData={source_hash}")
          if deployed_hash!=source_hash:
              raise SystemExit("HFSPLUS_BINARY_MISMATCH: deployed driver differs from pinned Acidanthera OcBinaryData")
          print("OPENCORE_BOOT_CHAIN_BINARY_MATCH=PASS (3/3)")
          print("HFSPLUS_PINNED_OCBINARYDATA_MATCH=PASS")
          PY
      - name: Apply isolated AppleInput variables
        env:
          APPLE_EVENT: ${{ matrix.profile.apple_event }}
          MIRRORING: ${{ matrix.profile.mirroring }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, shutil
          from pathlib import Path
          files=list(Path("baseline").glob("**/OC/config.plist"))
          assert len(files)==1,files
          config=files[0]; oc=config.parent; efi=oc.parent
          c=plistlib.loads(config.read_bytes())
          c["UEFI"]["Input"]["KeySupport"]=True
          c["UEFI"]["Input"]["KeySupportMode"]="AMI"
          c["UEFI"]["Drivers"]=[d for d in c["UEFI"]["Drivers"] if d.get("Path")!="OpenUsbKbDxe.efi"]
          (oc/"Drivers/OpenUsbKbDxe.efi").unlink(missing_ok=True)
          c["UEFI"]["AppleInput"]["AppleEvent"]=os.environ["APPLE_EVENT"]
          c["UEFI"]["AppleInput"]["GraphicsInputMirroring"]=os.environ["MIRRORING"]=="true"
          config.write_bytes(plistlib.dumps(c,fmt=plistlib.FMT_XML,sort_keys=False))
          out=Path("output/EFI"); shutil.copytree(efi,out)
          print("KEYSUPPORT=AMI; OPENUSBKBDXE=ABSENT")
          print("APPLE_EVENT="+os.environ["APPLE_EVENT"])
          print("GRAPHICS_INPUT_MIRRORING="+os.environ["MIRRORING"])
          PY
      - name: Official ocvalidate and exact invariants
        shell: bash
        run: |
          set -euo pipefail
          "$OCVALIDATE" output/EFI/OC/config.plist
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          e=Path("output/EFI"); o=e/"OC"
          c=plistlib.loads((o/"config.plist").read_bytes())
          assert c["UEFI"]["Input"]["KeySupport"] is True
          assert c["UEFI"]["Input"]["KeySupportMode"]=="AMI"
          assert c["UEFI"]["AppleInput"]["AppleEvent"]==os.environ["APPLE_EVENT"]
          assert c["UEFI"]["AppleInput"]["GraphicsInputMirroring"]==(os.environ["MIRRORING"]=="true")
          assert not any(d.get("Path")=="OpenUsbKbDxe.efi" and d.get("Enabled") for d in c["UEFI"]["Drivers"])
          assert not (o/"Drivers/OpenUsbKbDxe.efi").exists()
          for d in c["UEFI"]["Drivers"]:
              if d.get("Enabled"): assert (o/"Drivers"/d["Path"]).is_file(),d["Path"]
          for a in c["ACPI"]["Add"]:
              if a.get("Enabled"): assert (o/"ACPI"/a["Path"]).is_file(),a["Path"]
          for k in c["Kernel"]["Add"]:
              if k.get("Enabled"): assert (o/"Kexts"/k["BundlePath"]).exists(),k["BundlePath"]
          print("OFFICIAL_OCVALIDATE=PASS; ALL_ENABLED_PATHS=PASS")
          PY
      - name: Emit firmware input routing audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<PY
          import plistlib, json
          from pathlib import Path
          c=plistlib.loads(Path('output/EFI/OC/config.plist').read_bytes())
          u=c['UEFI']
          report={
            'UEFI.Input':u.get('Input',{}),
            'UEFI.AppleInput':u.get('AppleInput',{}),
            'UEFI.Drivers':u.get('Drivers',[]),
            'UEFI.ConnectDrivers':u.get('ConnectDrivers'),
            'UEFI.Quirks':u.get('Quirks',{}),
            'UEFI.ProtocolOverrides':u.get('ProtocolOverrides',{}),
            'Misc.Boot':c.get('Misc',{}).get('Boot',{}),
            'USB-related enabled kexts':[{'BundlePath':k.get('BundlePath'),'Enabled':k.get('Enabled'),'ExecutablePath':k.get('ExecutablePath')} for k in c.get('Kernel',{}).get('Add',[]) if any(x in k.get('BundlePath','').lower() for x in ('usb','xhci','utb'))],
            'USB-related ACPI':[{'Path':a.get('Path'),'Enabled':a.get('Enabled')} for a in c.get('ACPI',{}).get('Add',[]) if any(x in a.get('Path','').lower() for x in ('usb','ssdt'))],
          }
          print('=== FIRMWARE INPUT ROUTING AUDIT ===')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Package diagnostic profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          printf 'OpenCore 1.0.5 AppleInput diagnostic\nKeySupport=AMI; OpenUsbKbDxe absent\nAppleEvent=%s\nGraphicsInputMirroring=%s\n' "${APPLE_EVENT}" "${MIRRORING}" > output/DIAGNOSTIC-REPORT.txt
          cd output
          zip -qr "../B460M-OpenCore-1.0.5-AppleInput-${{ matrix.profile.name }}.zip" EFI DIAGNOSTIC-REPORT.txt
          unzip -t "../B460M-OpenCore-1.0.5-AppleInput-${{ matrix.profile.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: B460M-OpenCore-1.0.5-AppleInput-${{ matrix.profile.name }}
          path: |
            output/EFI/
            output/DIAGNOSTIC-REPORT.txt
          if-no-files-found: error

  build-debug-input-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned baseline and official OpenCore 1.0.5 DEBUG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15063694125/zip -o baseline.zip
          echo "f799c3b0be0a619230e1301f657f553e9f5db7edd7bd91ac9a4820c47442c38f  baseline.zip" | sha256sum --check
          mkdir baseline
          unzip -oq baseline.zip -d baseline
          curl --fail --location --retry 3 https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.5/OpenCore-1.0.5-DEBUG.zip -o OpenCore-1.0.5-DEBUG.zip
          echo "db0720000455502b34ad5a0fc53114f7cd6d388bc6af7636e8a530276a6bf0a1  OpenCore-1.0.5-DEBUG.zip" | sha256sum --check
          mkdir official
          unzip -oq OpenCore-1.0.5-DEBUG.zip -d official
          validator="$(find official -type f -name ocvalidate.linux -print -quit)"
          test -n "${validator}"
          chmod +x "${validator}"
          echo "OCVALIDATE=${validator}" >> "${GITHUB_ENV}"
      - name: Assemble official DEBUG input audit EFI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, plistlib, shutil
          from pathlib import Path
          configs=list(Path("baseline").glob("**/OC/config.plist"))
          assert len(configs)==1,configs
          oc=configs[0].parent; efi=oc.parent; src=Path("official/X64/EFI")
          pairs={"BOOT/BOOTx64.efi":src/"BOOT/BOOTx64.efi","OC/OpenCore.efi":src/"OC/OpenCore.efi","OC/Drivers/OpenRuntime.efi":src/"OC/Drivers/OpenRuntime.efi"}
          for rel,source in pairs.items():
              target=efi/rel
              assert target.is_file() and source.is_file(),rel
              shutil.copy2(source,target)
              assert hashlib.sha256(target.read_bytes()).digest()==hashlib.sha256(source.read_bytes()).digest(),rel
              print("OFFICIAL_DEBUG_HASH_MATCH",rel,hashlib.sha256(target.read_bytes()).hexdigest())
          c=plistlib.loads(configs[0].read_bytes())
          c["UEFI"]["Input"]["KeySupport"]=True
          c["UEFI"]["Input"]["KeySupportMode"]="Auto"
          c["UEFI"]["Input"]["KeyFiltering"]=False
          c["UEFI"]["AppleInput"]["AppleEvent"]="Auto"
          c["UEFI"]["AppleInput"]["GraphicsInputMirroring"]=True
          c["UEFI"]["Drivers"]=[d for d in c["UEFI"]["Drivers"] if d.get("Path")!="OpenUsbKbDxe.efi"]
          (oc/"Drivers/OpenUsbKbDxe.efi").unlink(missing_ok=True)
          d=c["Misc"]["Debug"]
          d["AppleDebug"]=True; d["ApplePanic"]=False
          d["DisplayLevel"]=2147483714; d["Target"]=65; d["SysReport"]=False
          c["Misc"]["Security"]["HaltLevel"]=2147483648
          configs[0].write_bytes(plistlib.dumps(c,fmt=plistlib.FMT_XML,sort_keys=False))
          out=Path("debug-output/EFI"); shutil.copytree(efi,out)
          print("DEBUG_INPUT_PROFILE=Auto; AppleEvent=Auto; Mirroring=On; log-to-file")
          PY
      - name: Validate DEBUG EFI
        shell: bash
        run: |
          set -euo pipefail
          "${OCVALIDATE}" debug-output/EFI/OC/config.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          e=Path("debug-output/EFI"); c=plistlib.loads((e/"OC/config.plist").read_bytes())
          assert c["UEFI"]["Input"]["KeySupportMode"]=="Auto"
          assert c["UEFI"]["AppleInput"]["AppleEvent"]=="Auto"
          assert c["UEFI"]["AppleInput"]["GraphicsInputMirroring"] is True
          assert c["Misc"]["Debug"]["Target"]==65
          assert c["Misc"]["Debug"]["DisplayLevel"]==2147483714
          for d in c["UEFI"]["Drivers"]:
              if d.get("Enabled"): assert (e/"OC/Drivers"/d["Path"]).is_file(),d["Path"]
          for a in c["ACPI"]["Add"]:
              if a.get("Enabled"): assert (e/"OC/ACPI"/a["Path"]).is_file(),a["Path"]
          for k in c["Kernel"]["Add"]:
              if k.get("Enabled"): assert (e/"OC/Kexts"/k["BundlePath"]).exists(),k["BundlePath"]
          print("OFFICIAL_OCVALIDATE=PASS; DEBUG_CONFIG_AND_ALL_ENABLED_PATHS=PASS")
          PY
      - name: Package DEBUG firmware input audit
        shell: bash
        run: |
          set -euo pipefail
          printf 'Official OpenCore 1.0.5 DEBUG\nKeySupport=Auto; AppleEvent=Auto; GraphicsInputMirroring=true\nTarget=65 (file log); DisplayLevel=2147483714 (verbose)\n' > debug-output/DIAGNOSTIC-REPORT.txt
          cd debug-output
          zip -qr ../B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit.zip EFI DIAGNOSTIC-REPORT.txt
          unzip -t ../B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit
          path: |
            debug-output/EFI/
            debug-output/DIAGNOSTIC-REPORT.txt
          if-no-files-found: error

  validate-debug-input-deployer:
    needs: build-debug-input-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download immutable pinned DEBUG artifact for deployer validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloaded-artifact
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15069512044/zip -o downloaded-artifact/B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit.zip
          echo "979b20840a8ac437562ed793f020ceef5f1a4c8740354ceb154cdbf8bde36c90  downloaded-artifact/B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit.zip" | sha256sum --check
      - name: Validate deployer syntax, artifact checksum, and EFI safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile B460M-OC-Builder/Deploy-B460M-OC105-DEBUG-Firmware-Input-Audit.py
          python3 - <<'PY'
          import hashlib, importlib.util, plistlib, tempfile
          from pathlib import Path
          p=Path('B460M-OC-Builder/Deploy-B460M-OC105-DEBUG-Firmware-Input-Audit.py')
          spec=importlib.util.spec_from_file_location('deployer',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          z=Path('downloaded-artifact/B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit.zip')
          assert z.is_file(),list(Path('downloaded-artifact').rglob('*'))
          digest=hashlib.sha256(z.read_bytes()).hexdigest()
          assert digest==m.EXPECTED_SHA256,(digest,m.EXPECTED_SHA256)
          with tempfile.TemporaryDirectory() as td:
              efi=m.safe_extract(z,Path(td)/'extract')
              count=m.verify_efi(efi)
              print('DEPLOYER_ARTIFACT_SHA256=PASS')
              print('DEPLOYER_SAFE_EXTRACT=PASS')
              print('DEPLOYER_VERIFY_EFI=PASS FILES='+str(count))
          source=p.read_text()
          forbidden=['Clear-Disk','Format-Volume','Remove-Partition','Initialize-Disk','Set-Partition','Remove-Item F:','rmdir F:']
          for token in forbidden: assert token.lower() not in source.lower(),token
          assert 'current.rename(backup)' in source and 'stage.rename(current)' in source
          print('DISK_SAFETY_STATIC_AUDIT=PASS; ONLY F:\\EFI SWAP PATH PRESENT')
          PY
