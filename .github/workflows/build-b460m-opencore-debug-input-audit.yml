name: B460M OpenCore 1.0.5 DEBUG firmware input audit

on:
  push:
    branches:
      - opencore-1.0.5-sequoia-rx570
    paths:
      - ".github/workflows/build-b460m-opencore-debug-input-audit.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-debug-input-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned baseline and official OpenCore 1.0.5 DEBUG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15063694125/zip -o baseline.zip
          echo "f799c3b0be0a619230e1301f657f553e9f5db7edd7bd91ac9a4820c47442c38f  baseline.zip" | sha256sum --check
          mkdir baseline
          unzip -oq baseline.zip -d baseline
          curl --fail --location --retry 3 https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.5/OpenCore-1.0.5-DEBUG.zip -o OpenCore-1.0.5-DEBUG.zip
          echo "db0720000455502b34ad5a0fc53114f7cd6d388bc6af7636e8a530276a6bf0a1  OpenCore-1.0.5-DEBUG.zip" | sha256sum --check
          mkdir official
          unzip -oq OpenCore-1.0.5-DEBUG.zip -d official
          validator="$(find official -type f -name ocvalidate.linux -print -quit)"
          test -n "${validator}"
          chmod +x "${validator}"
          echo "OCVALIDATE=${validator}" >> "${GITHUB_ENV}"
      - name: Replace only OpenCore boot chain with official DEBUG binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          configs=list(Path("baseline").glob("**/OC/config.plist"))
          assert len(configs)==1,configs
          oc=configs[0].parent
          efi=oc.parent
          src=Path("official/X64/EFI")
          pairs={
            "BOOT/BOOTx64.efi":src/"BOOT/BOOTx64.efi",
            "OC/OpenCore.efi":src/"OC/OpenCore.efi",
            "OC/Drivers/OpenRuntime.efi":src/"OC/Drivers/OpenRuntime.efi",
          }
          for rel,source in pairs.items():
              target=efi/rel
              assert target.is_file(),f"BASELINE_MISSING:{rel}"
              assert source.is_file(),f"OFFICIAL_DEBUG_MISSING:{source}"
              shutil.copy2(source,target)
              a=hashlib.sha256(target.read_bytes()).hexdigest()
              b=hashlib.sha256(source.read_bytes()).hexdigest()
              assert a==b,(rel,a,b)
              print(f"DEBUG_BINARY_MATCH {rel} SHA256={a}")
          import plistlib
          c=plistlib.loads(configs[0].read_bytes())
          c["UEFI"]["Input"]["KeySupport"]=True
          c["UEFI"]["Input"]["KeySupportMode"]="Auto"
          c["UEFI"]["Input"]["KeyFiltering"]=False
          c["UEFI"]["AppleInput"]["AppleEvent"]="Auto"
          c["UEFI"]["AppleInput"]["GraphicsInputMirroring"]=True
          c["UEFI"]["Drivers"]=[d for d in c["UEFI"]["Drivers"] if d.get("Path")!="OpenUsbKbDxe.efi"]
          (oc/"Drivers/OpenUsbKbDxe.efi").unlink(missing_ok=True)
          debug=c["Misc"]["Debug"]
          debug["AppleDebug"]=True
          debug["ApplePanic"]=False
          debug["DisableWatchdog"]=True
          debug["DisplayLevel"]=2151688018
          debug["Target"]=65
          debug["SysReport"]=False
          print("DEBUG_CONFIG: KeySupport=Auto; AppleEvent=Auto; Mirroring=True; Target=65; DisplayLevel=2151688018")
          out=Path("output/EFI")
          shutil.copytree(efi,out)
          PY
      - name: Official ocvalidate and binary/config invariants
        shell: bash
        run: |
          set -euo pipefail
          "${OCVALIDATE}" output/EFI/OC/config.plist
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          e=Path("output/EFI")
          c=plistlib.loads((e/"OC/config.plist").read_bytes())
          assert c["UEFI"]["Input"]["KeySupport"] is True
          assert c["UEFI"]["Input"]["KeySupportMode"]=="Auto"
          assert c["UEFI"]["AppleInput"]["AppleEvent"]=="Auto"
          assert c["UEFI"]["AppleInput"]["GraphicsInputMirroring"] is True
          assert c["Misc"]["Debug"]["Target"]==65
          assert c["Misc"]["Debug"]["DisplayLevel"]==2151688018
          assert c["Misc"]["Debug"]["DisableWatchdog"] is True
          assert not any(d.get("Path")=="OpenUsbKbDxe.efi" and d.get("Enabled") for d in c["UEFI"]["Drivers"])
          for d in c["UEFI"]["Drivers"]:
              if d.get("Enabled"): assert (e/"OC/Drivers"/d["Path"]).is_file(),d["Path"]
          for a in c["ACPI"]["Add"]:
              if a.get("Enabled"): assert (e/"OC/ACPI"/a["Path"]).is_file(),a["Path"]
          for k in c["Kernel"]["Add"]:
              if k.get("Enabled"): assert (e/"OC/Kexts"/k["BundlePath"]).exists(),k["BundlePath"]
          print("OFFICIAL_OCVALIDATE=PASS; DEBUG_BINARY_HASHES=PASS; CONFIG_AND_PATHS=PASS")
          PY
      - name: Package DEBUG input audit EFI
        shell: bash
        run: |
          set -euo pipefail
          cat > output/DIAGNOSTIC-REPORT.txt <<'EOF'
          B460M OpenCore 1.0.5 DEBUG firmware input audit
          DEBUG boot chain: official Acidanthera OpenCorePkg 1.0.5 DEBUG
          KeySupport=Auto; OpenUsbKbDxe absent
          AppleEvent=Auto; GraphicsInputMirroring=true
          Misc.Debug.Target=65 (log + file)
          Misc.Debug.DisplayLevel=2151688018 (verbose/info/warn/error)
          Expected result: OpenCore log file on EFI partition, including UEFI input protocol initialization diagnostics.
          Only use on the USB EFI partition; do not modify recovery payload or other partitions.
          EOF
          cd output
          zip -qr ../B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit.zip EFI DIAGNOSTIC-REPORT.txt
          unzip -t ../B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit.zip
      - uses: actions/upload-artifact@v4
        with:
          name: B460M-OpenCore-1.0.5-DEBUG-Firmware-Input-Audit
          path: |
            output/EFI/
            output/DIAGNOSTIC-REPORT.txt
          if-no-files-found: error
