name: Test B460M clean USB rebuild script
on:
  push:
    paths:
      - "B460M-OC-Builder/Rebuild-B460M-Sequoia-NO-SS04-USB.ps1"
      - "B460M-OC-Builder/Resume-B460M-Sequoia-NO-SS04-USB.ps1"
      - "B460M-OC-Builder/Build-B460M-Sequoia-NO-SS04-USB.ps1"
      - ".github/workflows/test-b460m-clean-rebuild-script.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  powershell-51-audit:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'B460M-OC-Builder/Rebuild-B460M-Sequoia-NO-SS04-USB.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Host; throw 'PowerShell parse failed.' }
          Write-Host 'POWERSHELL_51_PARSE=PASS'
      - name: Audit destructive scope and rebuild steps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Get-Content 'B460M-OC-Builder/Rebuild-B460M-Sequoia-NO-SS04-USB.ps1' -Raw
          $checks = [ordered]@{
            'Exact USB model' = $p.Contains("LITEON I T LCS-128L9S")
            'Exact USB serial' = $p.Contains("000000123ADC")
            'USB bus guard' = $p.Contains("`$_.BusType -eq 'USB'")
            'Boot/system guard' = $p.Contains('$d.IsBoot -or $d.IsSystem')
            'Explicit destructive confirmation' = ($p.Contains("Read-Host 'Enter 43024 to erase and rebuild this USB'") -and $p.Contains("$answer.Trim() -cne '43024'"))
            'DiskPart clean and GPT' = ($p.Contains("'clean'") -and $p.Contains("'convert gpt'"))
            'EFI partition' = $p.Contains('create partition efi size=16000')
            'FAT32 format' = $p.Contains('format fs=fat32 quick label=OC-SEQUOIA')
            'Apple recovery download' = $p.Contains('macrecovery.py')
            'EFI HS04 SS04 exclusion' = ($p.Contains('HS04') -and $p.Contains('SS04'))
            'SHA256 copy verification' = $p.Contains('Get-FileHash')
            'No Storage API mount calls' = (-not $p.Contains('Add-PartitionAccessPath'))
          }
          $checks.GetEnumerator() | ForEach-Object { Write-Host ("{0}={1}" -f $_.Key, $(if($_.Value){'PASS'}else{'FAIL'})) }
          if ($checks.Values -contains $false) { throw 'Static safety audit failed.' }
          Write-Host 'STATIC_REBUILD_AUDIT=PASS'

      - name: Parse and audit non-destructive resume script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'B460M-OC-Builder/Resume-B460M-Sequoia-NO-SS04-USB.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Host; throw 'Resume script parse failed.' }
          $s = Get-Content $p -Raw
          $checks = [ordered]@{
            'Exact USB identity' = ($s.Contains('LITEON I T LCS-128L9S') -and $s.Contains('000000123ADC'))
            'USB bus guard' = $s.Contains("`$_.BusType -eq 'USB'")
            'Existing ESP GUID check' = $s.Contains('c12a7328-f81f-11d2-ba4b-00a0c93ec93b')
            'Temporary Basic Data GUID' = $s.Contains('ebd0a0a2-b9e5-4433-87c0-68b6b72699c7')
            'Temporary type change before drive-letter assignment' = ($s.IndexOf('-GptType $BasicData') -lt $s.IndexOf('-NewDriveLetter $chosenLetter'))
            'ESP restored after file copy' = ($s.IndexOf('Remove-PartitionAccessPath -DiskNumber') -lt $s.LastIndexOf('-GptType $Esp'))
            'Final ESP and no drive letter verified' = $s.Contains('FINAL_PARTITION_TYPE=EFI_SYSTEM_PARTITION; DRIVE_LETTER=REMOVED')
            'No clean command' = (-not $s.Contains("'clean'"))
            'No format command' = (-not $s.Contains('format fs='))
            'No partition creation' = (-not $s.Contains('create partition'))
            'EFI SHA256 verification' = $s.Contains('Get-FileHash')
            'Apple chunklist verification' = $s.Contains('verify_image')
          }
          $checks.GetEnumerator() | ForEach-Object { Write-Host ("{0}={1}" -f $_.Key, $(if($_.Value){'PASS'}else{'FAIL'})) }
          if ($checks.Values -contains $false) { throw 'Resume script safety audit failed.' }
          Write-Host 'NONDESTRUCTIVE_RESUME_AUDIT=PASS'

      - name: Parse and audit new Basic-Data-to-ESP builder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'B460M-OC-Builder/Build-B460M-Sequoia-NO-SS04-USB.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List | Out-String | Write-Host; throw 'New builder PowerShell parse failed.' }
          $s = Get-Content $p -Raw
          $checks = [ordered]@{
            'Exact USB model and serial' = ($s.Contains('LITEON I T LCS-128L9S') -and $s.Contains('000000123ADC'))
            'USB bus and boot/system guards' = ($s.Contains("`$_.BusType -eq 'USB'") -and $s.Contains('$d.IsBoot -or $d.IsSystem'))
            'Require fully unallocated disk' = $s.Contains('Expected fully unallocated disk')
            'DiskPart GPT and FAT32 creation' = ($s.Contains("'clean'") -and $s.Contains("'convert gpt'") -and $s.Contains('create partition primary size=16000') -and $s.Contains('format fs=fat32 quick label=OC-SEQUOIA'))
            'Basic Data volume verified before copy' = $s.Contains('TEMPORARY_BASIC_DATA_VOLUME_VERIFIED')
            'EFI and Recovery SHA256 verification' = ($s.Contains('EFI SHA256 mismatch') -and $s.Contains('Recovery SHA256 mismatch'))
            'Final ESP conversion' = $s.Contains('Set-Partition -DiskNumber $d.Number -PartitionNumber $part.PartitionNumber -GptType $Esp')
            'Final drive letter removed' = $s.Contains('FINAL_PARTITION_TYPE=EFI_SYSTEM_PARTITION; DRIVE_LETTER=REMOVED')
            'Safety restore on interruption' = $s.Contains('SAFETY_RESTORE')
          }
          $checks.GetEnumerator() | ForEach-Object { Write-Host ("{0}={1}" -f $_.Key, $(if($_.Value){'PASS'}else{'FAIL'})) }
          if ($checks.Values -contains $false) { throw 'New builder static audit failed.' }
          Write-Host 'NEW_BASIC_DATA_TO_ESP_BUILDER_AUDIT=PASS'
