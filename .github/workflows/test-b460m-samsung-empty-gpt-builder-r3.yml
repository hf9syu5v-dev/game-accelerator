name: Validate Samsung USB empty-GPT builder r3 (Windows PowerShell 5.1)

on:
  push:
    branches: [main]
    paths:
      - "tools/Build-B460M-Sequoia-USB-Samsung-256GB-r3.ps1"
      - ".github/workflows/test-b460m-samsung-empty-gpt-builder-r3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-51-builder-validation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Confirm the legacy Builder source version and SHA256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = (Get-Content 'tests/powershell/fixtures/Build-B460M-Sequoia-USB-Samsung-256GB.ps1.gz.b64' -Raw).Trim()
          $compressed = [Convert]::FromBase64String($encoded)
          $legacyInput = New-Object System.IO.MemoryStream(,$compressed)
          $legacyGzip = New-Object System.IO.Compression.GzipStream($legacyInput,[System.IO.Compression.CompressionMode]::Decompress)
          $legacyOutput = New-Object System.IO.MemoryStream
          $legacyGzip.CopyTo($legacyOutput)
          $legacyPath = Join-Path $env:RUNNER_TEMP 'legacy-builder.ps1'
          [IO.File]::WriteAllBytes($legacyPath,$legacyOutput.ToArray())
          $legacyInput.Dispose(); $legacyGzip.Dispose(); $legacyOutput.Dispose()
          $legacyHash = (Get-FileHash -LiteralPath $legacyPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "LEGACY_BUILDER_SHA256=$legacyHash"
          if ($legacyHash -ne '415ce293bcc536a1bef3742460b62e5f73bde56564b336b1fc18ddd807277fd6') { throw 'LEGACY_BUILDER_SHA256_MISMATCH' }
          Write-Host 'LEGACY_BUILDER_VERSION=three-partition-layout; SHA256=PASS'

      - name: Hash and parse the complete builder with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $p = 'tools/Build-B460M-Sequoia-USB-Samsung-256GB-r3.ps1'
          $hash = (Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "R3_BUILDER_SHA256=$hash"
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw 'R3_POWERSHELL_51_PARSE_FAILED' }
          Write-Host 'R3_POWERSHELL_51_PARSE=PASS'

      - name: Run builder safety and empty-GPT self-tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & 'tools/Build-B460M-Sequoia-USB-Samsung-256GB-r3.ps1' -SelfTest
          if (-not $?) { throw 'R3_BUILDER_SELFTEST_FAILED' }

      - name: Static safety checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $s = Get-Content -LiteralPath 'tools/Build-B460M-Sequoia-USB-Samsung-256GB-r3.ps1' -Raw
          foreach ($required in @('000000123ADC','Samsung SSD 860 EVO','USBSTOR\','PHYSICALDRIVE','IsBoot','IsSystem','CREATE EFI BOOT PARTITION ON SAMSUNG USB','Get-TargetPartitions','PartitionStyle','E:','F:','XhciPortLimit','0x200703')) {
            if (-not $s.Contains($required)) { throw "R3_REQUIRED_GUARD_MISSING=$required" }
          }
          if ($s -match "(?m)^\s*'clean'\s*,?\s*$") { throw 'R3_MUST_NOT_DISKPART_CLEAN' }
          if ($s -match '(?m)^\s*(Clear-Disk|Format-Volume|Initialize-Disk|Remove-Partition)\b') { throw 'R3_UNEXPECTED_DESTRUCTIVE_CMDLET' }
          Write-Host 'R3_STATIC_SAFETY_CHECKS=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify published EFI02 release asset and all 60 manifest entries
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/hf9syu5v-dev/game-accelerator/releases/download/b460m-baseline-efi02-sequoia-oc108/'
          $dir = Join-Path $env:RUNNER_TEMP 'efi02-audit'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $zip = Join-Path $dir 'B460M-Baseline-EFI-02.zip'
          $manifest = Join-Path $dir 'EFI-SHA256SUMS.txt'
          Invoke-WebRequest -Uri ($base + 'B460M-Baseline-EFI-02.zip') -OutFile $zip -UseBasicParsing
          Invoke-WebRequest -Uri ($base + 'EFI-SHA256SUMS.txt') -OutFile $manifest -UseBasicParsing
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c639d82cf099da15afe6fce1b15b47e833c62a9bb77d628a1ccaff4953c1086c') { throw 'EFI02_RELEASE_ZIP_HASH_MISMATCH' }
          if ((Get-FileHash $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne '635023086dbbad2bf8b72ad7bb640b234c90f903edbdf6da0f66a3d55d27ac50') { throw 'EFI02_RELEASE_MANIFEST_HASH_MISMATCH' }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $dir 'unpacked') -Force
          $root = Join-Path $dir 'unpacked\EFI'
          $lines = @(Get-Content -LiteralPath $manifest | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($lines.Count -ne 60) { throw "EFI02_MANIFEST_COUNT=$($lines.Count)" }
          foreach ($line in $lines) {
            if ($line -notmatch '^([0-9a-fA-F]{64})\s+(.+)$') { throw "EFI02_MANIFEST_FORMAT=$line" }
            $rel = $Matches[2].Replace('/','\')
            $file = Join-Path $root $rel
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "EFI02_FILE_MISSING=$rel" }
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $Matches[1].ToLowerInvariant()) { throw "EFI02_FILE_HASH_MISMATCH=$rel" }
          }
          $ocZip = Join-Path $dir 'OpenCore-1.0.8-RELEASE.zip'
          Invoke-WebRequest -Uri 'https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.8/OpenCore-1.0.8-RELEASE.zip' -OutFile $ocZip -UseBasicParsing
          if ((Get-FileHash $ocZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2011e8b7216ecb2645d97ea710df965947edd406846e92050b9bc4190be6d27b') { throw 'OPENCORE_1_0_8_RELEASE_HASH_MISMATCH' }
          $helper = Join-Path $dir 'patch-check.py'
          @'
          import plistlib,sys
          p,m=sys.argv[1],sys.argv[2]
          with open(p,'rb') as f: c=plistlib.load(f)
          with open(m,'rb') as f: u=plistlib.load(f)
          c['Kernel']['Quirks']['XhciPortLimit']=False
          c['Misc']['Boot']['Timeout']=0
          c['Misc']['Security']['ScanPolicy']=0x200703
          g=c['PlatformInfo']['Generic']
          assert g['SystemSerialNumber']=='REPLACE_LOCALLY' and g['MLB']=='REPLACE_LOCALLY'
          assert g['SystemUUID']=='00000000-0000-0000-0000-000000000000' and bytes(g['ROM'])==bytes(6)
          k={x['BundlePath']:x for x in c['Kernel']['Add']}
          assert k['UTBMap.kext']['Enabled'] is True
          ports=u['IOKitPersonalities']['XHC']['IOProviderMergeProperties']['ports']
          assert len(ports)==11
          with open(p,'wb') as f: plistlib.dump(c,f,fmt=plistlib.FMT_XML,sort_keys=False)
          with open(p,'rb') as f: d=plistlib.load(f)
          assert d['Kernel']['Quirks']['XhciPortLimit'] is False
          assert d['Misc']['Boot']['Timeout']==0 and d['Misc']['Security']['ScanPolicy']==0x200703
          print('EFI02_CONFIG_PATCH_AND_11_PORT_UTBMAP=PASS')
          '@ | Set-Content -LiteralPath $helper -Encoding ASCII
          & python $helper (Join-Path $root 'OC\config.plist') (Join-Path $root 'OC\Kexts\UTBMap.kext\Contents\Info.plist')
          if ($LASTEXITCODE -ne 0) { throw 'EFI02_CONFIG_PATCH_TEST_FAILED' }
          Write-Host 'EFI02_RELEASE_ASSET_MANIFEST_OPENCORE_AND_CONFIG_CHECKS=PASS'

      - name: Exercise empty-GPT precondition and ESP creation on disposable VHD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vhd = Join-Path $env:RUNNER_TEMP 'b460m-r3-layout.vhdx'
          $before = @((Get-Disk | Select-Object -ExpandProperty Number))
          $letter = @('Z','Y','X','W','V','U','T','S','R','Q','P','O','N','M','L','K','J','I','H','G') | Where-Object { -not (Test-Path ($_.ToString() + ':')) } | Select-Object -First 1
          if (-not $letter) { throw 'NO_TEST_DRIVE_LETTER' }
          $create = Join-Path $env:RUNNER_TEMP 'r3-vhd-create.txt'
          @"
          create vdisk file="$vhd" maximum=32768 type=expandable
          select vdisk file="$vhd"
          attach vdisk
          exit
          "@ | Set-Content -LiteralPath $create -Encoding ASCII
          & diskpart.exe /s $create
          if ($LASTEXITCODE -ne 0) { throw 'R3_VHD_CREATE_ATTACH_FAILED' }
          $new = @(Get-Disk | Where-Object { $_.Number -notin $before })
          if ($new.Count -ne 1) { throw "R3_EXPECTED_ONE_VHD=$($new.Count)" }
          $d = $new[0]
          Initialize-Disk -Number $d.Number -PartitionStyle GPT -ErrorAction Stop | Out-Null
          $msrGuid = 'e3c9e316-0b5c-4db8-817d-f92df00215ae'
          $msr = @(Get-Partition -DiskNumber $d.Number -ErrorAction Stop | Where-Object { ([string]$_.GptType).Trim('{}').ToLowerInvariant() -eq $msrGuid })
          if ($msr.Count -ne 1) { throw "R3_VHD_MSR_COUNT=$($msr.Count)" }
          Remove-Partition -DiskNumber $d.Number -PartitionNumber $msr[0].PartitionNumber -Confirm:$false -ErrorAction Stop
          if (Get-Command Update-HostStorageCache -ErrorAction SilentlyContinue) { Update-HostStorageCache -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2
          $emptyParts = @(Get-Partition -DiskNumber $d.Number -ErrorAction Stop)
          $allMsft = @(Get-CimInstance -Namespace 'root/Microsoft/Windows/Storage' -ClassName 'MSFT_Partition' -ErrorAction Stop)
          $emptyMsft = @($allMsft | Where-Object { [uint32]$_.DiskNumber -eq [uint32]$d.Number })
          if ($d.PartitionStyle -ne 'GPT' -or $emptyParts.Count -ne 0 -or $emptyMsft.Count -ne 0) { throw 'R3_VHD_EMPTY_GPT_PRECONDITION_FAILED' }
          Write-Host 'R3_EMPTY_GPT_ZERO_PARTITIONS=PASS'
          $createEsp = Join-Path $env:RUNNER_TEMP 'r3-vhd-esp.txt'
          @("select disk $($d.Number)",'create partition efi size=16000','format fs=fat32 quick label=OC-SEQUOIA',"assign letter=$letter",'exit') | Set-Content -LiteralPath $createEsp -Encoding ASCII
          & diskpart.exe /s $createEsp
          if ($LASTEXITCODE -ne 0) { throw 'R3_VHD_ESP_DISKPART_FAILED' }
          $parts = @(Get-Partition -DiskNumber $d.Number -ErrorAction Stop)
          $esp = @($parts | Where-Object { ([string]$_.GptType).Trim('{}').ToLowerInvariant() -eq 'c12a7328-f81f-11d2-ba4b-00a0c93ec93b' })
          $vol = Get-CimInstance Win32_LogicalDisk -Filter ("DeviceID='{0}:'" -f $letter) -ErrorAction Stop
          if ($parts.Count -ne 1 -or $esp.Count -ne 1 -or $esp[0].Size -lt 15GB -or $esp[0].Size -gt 17GB -or $vol.FileSystem -ne 'FAT32' -or $vol.VolumeName -ne 'OC-SEQUOIA') { throw 'R3_VHD_ESP_LAYOUT_INVALID' }
          Write-Host 'R3_DISPOSABLE_VHD_GPT_ESP_FAT32_LAYOUT=PASS'
          $detach = Join-Path $env:RUNNER_TEMP 'r3-vhd-detach.txt'
          $detachLine = 'select vdisk file="' + $vhd + '"'
          @($detachLine,'detach vdisk','exit') | Set-Content -LiteralPath $detach -Encoding ASCII
          & diskpart.exe /s $detach
          if ($LASTEXITCODE -ne 0) { throw 'R3_VHD_DETACH_FAILED' }
          Remove-Item -LiteralPath $vhd -Force

      - name: Publish exact tested builder source as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B460M-Samsung-USB-Builder-r3-source
          path: tools/Build-B460M-Sequoia-USB-Samsung-256GB-r3.ps1
          if-no-files-found: error
