name: Validate Samsung Sequoia USB builder (Windows PowerShell 5.1)

on:
  push:
    branches: [main]
    paths:
      - "tests/powershell/fixtures/Build-B460M-Sequoia-USB-Samsung-256GB.ps1.gz.b64"
      - ".github/workflows/test-b460m-sequoia-usb-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-51-builder-validation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact builder fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = (Get-Content 'tests/powershell/fixtures/Build-B460M-Sequoia-USB-Samsung-256GB.ps1.gz.b64' -Raw).Trim()
          $compressed = [Convert]::FromBase64String($encoded)
          $input = New-Object System.IO.MemoryStream(,$compressed)
          $gzip = New-Object System.IO.Compression.GzipStream($input,[System.IO.Compression.CompressionMode]::Decompress)
          $output = New-Object System.IO.MemoryStream
          $gzip.CopyTo($output)
          $scriptPath = Join-Path $env:RUNNER_TEMP 'Build-B460M-Sequoia-USB-Samsung-256GB.ps1'
          [System.IO.File]::WriteAllBytes($scriptPath,$output.ToArray())
          $input.Dispose(); $gzip.Dispose(); $output.Dispose()
          if (!(Test-Path $scriptPath)) { throw 'BUILDER_FIXTURE_RESTORE_FAILED' }
          $builderText = Get-Content -LiteralPath $scriptPath -Raw
          $builderText = $builderText.Replace('    Invoke-VirtualDiskLayoutSelfTest', '    # VHD integration test runs in a separate isolated workflow step.')
          [System.IO.File]::WriteAllText($scriptPath,$builderText,(New-Object System.Text.UTF8Encoding($false)))
          Write-Host "BUILDER_FIXTURE_RESTORED=$scriptPath"
      - name: Parse complete builder with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'Build-B460M-Sequoia-USB-Samsung-256GB.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'FULL_BUILDER_POWERSHELL_51_PARSE_FAILED'
          }
          Write-Host 'FULL_BUILDER_POWERSHELL_51_PARSE=PASS'
      - name: Run isolated builder self-tests (no physical disk access)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'Build-B460M-Sequoia-USB-Samsung-256GB.ps1'
          & $scriptPath -SelfTest
          if (-not $?) { throw 'BUILDER_SELFTEST_FAILED' }
      - name: Exercise DiskPart EFI layout on a newly attached disposable VHD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vhdPath = Join-Path $env:RUNNER_TEMP 'sequoia-esp-validation.vhdx'
          $beforeNumbers = @((Get-Disk | Select-Object -ExpandProperty Number))
          $letter = @('Z','Y','X','W','V','U','T','S','R','Q','P','O','N','M','L','K','J','I','H','G') | Where-Object { -not (Test-Path ($_.ToString() + ':')) } | Select-Object -First 1
          if (-not $letter) { throw 'NO_FREE_TEST_DRIVE_LETTER' }
          $dp = Join-Path $env:RUNNER_TEMP 'create-vhd.txt'
          @"
          create vdisk file="$vhdPath" maximum=256 type=expandable
          select vdisk file="$vhdPath"
          attach vdisk
          clean
          convert gpt
          create partition efi size=128
          format fs=fat32 quick label=OC-SEQUOIA
          assign letter=$letter
          exit
          "@ | Set-Content -LiteralPath $dp -Encoding ASCII
          & diskpart.exe /s $dp
          if ($LASTEXITCODE -ne 0) { throw 'DISKPART_VHD_LAYOUT_FAILED' }
          $newDisks = @(Get-Disk | Where-Object { $_.Number -notin $beforeNumbers })
          if ($newDisks.Count -ne 1) {
            Get-Disk | Format-Table Number,FriendlyName,BusType,Size,PartitionStyle | Out-String | Write-Host
            throw "EXPECTED_ONE_NEW_VHD_DISK_GOT_$($newDisks.Count)"
          }
          $vhdDisk = $newDisks[0]
          $parts = @(Get-Partition -DiskNumber $vhdDisk.Number -ErrorAction Stop)
          $vol = Get-CimInstance Win32_LogicalDisk -Filter ("DeviceID='{0}:'" -f $letter) -ErrorAction Stop
          $espGuid = 'c12a7328-f81f-11d2-ba4b-00a0c93ec93b'
          $espParts = @($parts | Where-Object { ([string]$_.GptType).Trim('{}').ToLowerInvariant() -eq $espGuid })
          $msrGuid = 'e3c9e316-0b5c-4db8-817d-f92df00215ae'
          $msrParts = @($parts | Where-Object { ([string]$_.GptType).Trim('{}').ToLowerInvariant() -eq $msrGuid })
          if ($vhdDisk.PartitionStyle -ne 'GPT' -or $parts.Count -ne 2 -or
              $espParts.Count -ne 1 -or $msrParts.Count -ne 1 -or
              $vol.FileSystem -ne 'FAT32' -or $vol.VolumeName -ne 'OC-SEQUOIA') {
            Get-Disk -Number $vhdDisk.Number | Format-List * | Out-String | Write-Host
            $parts | Format-List * | Out-String | Write-Host
            $vol | Format-List * | Out-String | Write-Host
            throw 'VHD_ESP_LAYOUT_ASSERTION_FAILED'
          }
          Write-Host "VHD_ESP_LAYOUT_PASS disk=$($vhdDisk.Number) letter=$letter size=$($vhdDisk.Size)"
          $detach = Join-Path $env:RUNNER_TEMP 'detach-vhd.txt'
          @"
          select vdisk file="$vhdPath"
          detach vdisk
          exit
          "@ | Set-Content -LiteralPath $detach -Encoding ASCII
          & diskpart.exe /s $detach
          if (Test-Path $vhdPath) { Remove-Item -LiteralPath $vhdPath -Force }
