name: Validate Samsung Sequoia USB builder (Windows PowerShell 5.1)

on:
  push:
    branches: [main]
    paths:
      - "tests/powershell/fixtures/Build-B460M-Sequoia-USB-Samsung-256GB.ps1.gz.b64"
      - ".github/workflows/test-b460m-sequoia-usb-builder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-51-builder-validation:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact local builder fixture
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = (Get-Content 'tests/powershell/fixtures/Build-B460M-Sequoia-USB-Samsung-256GB.ps1.gz.b64' -Raw).Trim()
          $compressed = [Convert]::FromBase64String($encoded)
          $input = New-Object System.IO.MemoryStream(,$compressed)
          $gzip = New-Object System.IO.Compression.GzipStream($input,[System.IO.Compression.CompressionMode]::Decompress)
          $output = New-Object System.IO.MemoryStream
          $gzip.CopyTo($output)
          $scriptPath = Join-Path $env:RUNNER_TEMP 'Build-B460M-Sequoia-USB-Samsung-256GB.ps1'
          [System.IO.File]::WriteAllBytes($scriptPath,$output.ToArray())
          $input.Dispose(); $gzip.Dispose(); $output.Dispose()
          $builderText = Get-Content -LiteralPath $scriptPath -Raw
          $oldVhd = @'
        $partition = Get-Partition -DriveLetter $letter -ErrorAction Stop
        $volume = Get-Volume -DriveLetter $letter -ErrorAction Stop
        if ($partition.DiskNumber -ne $vhdDiskNumber -or ([string]$partition.GptType).Trim('{}').ToLowerInvariant() -ne $EspGuid -or $volume.FileSystem -ne 'FAT32' -or $volume.FileSystemLabel -ne 'OC-SEQUOIA') {
            throw 'VHD_SELFTEST_LAYOUT_ASSERTION_FAILED'
        }
'@
          $newVhd = @'
        $vhdPartitions = @(Get-TargetPartitions -DiskNumber ([uint32]$vhdDiskNumber))
        $partition = @($vhdPartitions | Where-Object { [string]$_.DriveLetter -eq $letter })
        $volume = Get-CimInstance Win32_LogicalDisk -Filter ("DeviceID='{0}:'" -f $letter) -ErrorAction Stop
        if ($vhdPartitions.Count -ne 1 -or $partition.Count -ne 1 -or ([string]$partition[0].GptType).Trim('{}').ToLowerInvariant() -ne $EspGuid -or !$volume -or $volume.FileSystem -ne 'FAT32' -or $volume.VolumeName -ne 'OC-SEQUOIA') {
            throw 'VHD_SELFTEST_LAYOUT_ASSERTION_FAILED'
        }
'@
          $oldReal = @'
    $volume = Get-Volume -DriveLetter $availableLetter -ErrorAction Stop
    $partition = Get-Partition -DriveLetter $availableLetter -ErrorAction Stop
    if ($partition.DiskNumber -ne $targetAgain.Number -or ([string]$partition.GptType).Trim('{}').ToLowerInvariant() -ne $EspGuid -or $volume.FileSystem -ne 'FAT32' -or $volume.FileSystemLabel -ne 'OC-SEQUOIA') {
        throw 'FORMATTED_USB_LAYOUT_VERIFICATION_FAILED'
    }
'@
          $newReal = @'
    $createdPartitions = @(Get-TargetPartitions -DiskNumber ([uint32]$targetAgain.Number))
    $espMatches = @($createdPartitions | Where-Object { [string]$_.DriveLetter -eq $availableLetter })
    $volume = Get-CimInstance Win32_LogicalDisk -Filter ("DeviceID='{0}:'" -f $availableLetter) -ErrorAction Stop
    if ($createdPartitions.Count -ne 1 -or $espMatches.Count -ne 1 -or ([string]$espMatches[0].GptType).Trim('{}').ToLowerInvariant() -ne $EspGuid -or !$volume -or $volume.FileSystem -ne 'FAT32' -or $volume.VolumeName -ne 'OC-SEQUOIA') {
        throw 'FORMATTED_USB_LAYOUT_VERIFICATION_FAILED'
    }
'@
          if (!$builderText.Contains($oldVhd) -or !$builderText.Contains($oldReal)) { throw 'BUILDER_FIXTURE_PATCH_ANCHOR_MISSING' }
          $builderText = $builderText.Replace($oldVhd,$newVhd).Replace($oldReal,$newReal).Replace('Write-Verbose $_','Write-Host $_')
          [System.IO.File]::WriteAllText($scriptPath,$builderText,(New-Object System.Text.UTF8Encoding($false)))
          if (!(Test-Path $scriptPath)) { throw 'BUILDER_FIXTURE_RESTORE_FAILED' }
          Write-Host "BUILDER_FIXTURE_RESTORED=$scriptPath"
      - name: Parse complete builder with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'Build-B460M-Sequoia-USB-Samsung-256GB.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath,[ref]$tokens,[ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw 'FULL_BUILDER_POWERSHELL_51_PARSE_FAILED'
          }
          Write-Host 'FULL_BUILDER_POWERSHELL_51_PARSE=PASS'
      - name: Run isolated builder self-tests (no physical disk access)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $env:RUNNER_TEMP 'Build-B460M-Sequoia-USB-Samsung-256GB.ps1'
          & $scriptPath -SelfTest -Verbose
          if (-not $?) { throw "BUILDER_SELFTEST_FAILED" }
