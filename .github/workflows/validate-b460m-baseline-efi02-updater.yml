name: Validate Baseline EFI 02 single-run updater

on:
  push:
    branches:
      - opencore-1.0.5-sequoia-rx570
    paths:
      - "B460M-OC-Builder/Update-B460M-Baseline-EFI02.ps1"
      - ".github/workflows/validate-b460m-baseline-efi02-updater.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse PowerShell 5.1 syntax
        shell: powershell
        run: |
          $path = "B460M-OC-Builder/Update-B460M-Baseline-EFI02.ps1"
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("line {0}, column {1}: {2}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message) }
            throw "PowerShell parser reported syntax errors."
          }
          Write-Host "POWERSHELL_51_PARSE=PASS"

      - name: Verify updater safety guards
        shell: powershell
        run: |
          $path = "B460M-OC-Builder/Update-B460M-Baseline-EFI02.ps1"
          $s = Get-Content -LiteralPath $path -Raw
          $required = @(
            '000000123ADC',
            'LCS-128L9S$',
            '$i219Adapters',
            'UPDATE-B460M-EFI02',
            'EFI-PREVIOUS-BASELINE02-',
            'EFI-FAILED-BASELINE02-',
            'EFI-SHA256SUMS.txt',
            'c639d82cf099da15afe6fce1b15b47e833c62a9bb77d628a1ccaff4953c1086c',
            'Single-run deployment',
            'C02J5NYBPN5T',
            'C02231609GUPHC1JC',
            '78BDA777-E7DE-493E-BB3C-DE76B4D3AEE6',
            'Get-NetAdapter -Physical',
            'SMBIOS_INJECTION_VERIFIED',
            'Assert-RecoveryReadOnly',
            'Previous EFI restored successfully'
          )
          foreach ($item in $required) {
            if ($s -notlike "*$item*") { throw "Missing required marker: $item" }
          }
          foreach ($item in @('Format-Volume','Clear-Disk','Remove-Partition','Set-Partition','Initialize-Disk','New-Partition')) {
            if ($s.Contains($item)) { throw "Forbidden disk operation found: $item" }
          }
          if ($s -match 'ValidateSet\("Prepare","Apply"\)' -or $s -match '\$Step -eq') {
            throw "Legacy Prepare/Apply interface detected."
          }
          Write-Host "UPDATER_SAFETY_GUARDS=PASS"
