name: Validate B460M keyboard transplant 02 deployer
on:
  workflow_dispatch:
  push:
    branches:
      - opencore-1.0.5-sequoia-rx570
    paths:
      - "B460M-OC-Builder/Deploy-B460M-Keyboard-Transplant-02.ps1"
      - ".github/workflows/validate-b460m-keyboard-transplant-02-deployer.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell and audit safety boundaries
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $path='B460M-OC-Builder/Deploy-B460M-Keyboard-Transplant-02.ps1'
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|Format-List|Out-String|Write-Error}
          $s=Get-Content -LiteralPath $path -Raw
          foreach($term in @('Clear-Disk','Initialize-Disk','Format-Volume','New-Partition','Remove-Partition','Set-Partition','diskpart','clean all','Set-Disk')){
            if($s -match [regex]::Escape($term)){throw "Forbidden disk/partition operation: $term"}
          }
          foreach($required in @('000000123ADC','LITEON I T LCS-128L9S','395a589cbb8aecc2d356e02a41b8f7d867d7ca08ace2467af5bb6a4eadccd1fd','OpenUsbKbDxe.efi','BaseSystem.dmg','BaseSystem.chunklist','KEYBOARD_TRANSPLANT_02_DEPLOYMENT_SUCCESS','Rename-Item')){
            if($s -notmatch [regex]::Escape($required)){throw "Missing safety assertion: $required"}
          }
          'POWERSHELL_PARSE=PASS'
          'USB_IDENTITY_GUARD=PASS'
          'RECOVERY_HASH_GUARD=PASS'
          'ARTIFACT_HASH_PIN=PASS'
          'EFI_ONLY_BACKUP_STAGE_ROLLBACK=PASS'
          'NO_PARTITION_OR_INTERNAL_DISK_MUTATION=PASS'
      - name: Verify release asset hash and EFI structure
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $url='https://github.com/hf9syu5v-dev/game-accelerator/releases/download/b460m-keyboard-transplant-02/B460M-Keyboard-Transplant-02-OpenUsbKbDxe.zip'
          $expected='395a589cbb8aecc2d356e02a41b8f7d867d7ca08ace2467af5bb6a4eadccd1fd'
          $zip=Join-Path $env:RUNNER_TEMP 'candidate02.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $actual=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -ne $expected){throw "SHA256 mismatch: $actual"}
          $out=Join-Path $env:RUNNER_TEMP 'candidate02'; Expand-Archive -LiteralPath $zip -DestinationPath $out
          $efi=Join-Path $out 'EFI'
          foreach($rel in @('BOOT\BOOTx64.efi','OC\OpenCore.efi','OC\config.plist','OC\Drivers\OpenUsbKbDxe.efi','OC\Kexts\UTBMap.kext\Contents\Info.plist')){
            if(!(Test-Path (Join-Path $efi $rel) -PathType Leaf)){throw "Missing EFI file: $rel"}
          }
          $cfg=Get-Content (Join-Path $efi 'OC\config.plist') -Raw
          if($cfg -notmatch '(?s)<key>KeySupport</key>\s*<false\s*/>' -or $cfg -notmatch '(?s)<key>PollAppleHotKeys</key>\s*<false\s*/>' -or $cfg -notmatch 'OpenUsbKbDxe\.efi'){throw 'Candidate 02 input profile mismatch.'}
          'CANDIDATE_02_RELEASE_AND_CONFIG=PASS'
