name: Validate OpenCore 1.0.5 OpenUsbKbDxe deployment safety

on:
  workflow_dispatch:
  push:
    branches:
      - opencore-1.0.5-sequoia-rx570
    paths:
      - "B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py"
      - "B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.ps1"
      - ".github/workflows/validate-b460m-oc105-openusbkbd-deploy.yml"

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows PowerShell 5.1 parser validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path 'B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.ps1').Path
          $t=$null; $e=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$t,[ref]$e) | Out-Null
          if ($e.Count) { $e | Format-List | Out-String | Write-Error }
          'POWERSHELL_5_1_PARSE=PASS'
      - name: Python syntax and safety-boundary audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py'
          $s=Get-Content -LiteralPath $p -Raw
          python -m py_compile $p
          foreach($x in @('000000123ADC','LITEON I T LCS-128L9S','128035676160','Get-Partition','Get-Disk','IsBoot','IsSystem','com.apple.recovery.boot','BaseSystem.dmg','BaseSystem.chunklist','KeySupport','OpenUsbKbDxe.efi','EXPECTED_SHA256','EFI-PREVIOUS-OPENUSBKBD105')) {
            if (!$s.Contains($x)) { throw "Missing required guard: $x" }
          }
          foreach($x in @('Clear-Disk','Initialize-Disk','New-Partition','Remove-Partition','Format-Volume','Set-Partition','Set-Disk','diskpart','clean all')) {
            if ($s.Contains($x)) { throw "Forbidden destructive operation token: $x" }
          }
          'PYTHON_SYNTAX=PASS'
          'USB_IDENTITY_AND_RECOVERY_GUARDS=PASS'
          'NO_PARTITION_OR_FORMAT_OPERATIONS=PASS'
      - name: Exercise ZIP extraction and EFI root detection with fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, tempfile, zipfile
          from pathlib import Path
          p=Path('B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py')
          spec=importlib.util.spec_from_file_location('deployer',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              z=Path(td)/'fixture.zip'
              with zipfile.ZipFile(z,'w') as a:
                  a.writestr('EFI/OC/config.plist',b'fixture')
              root=m.safe_extract(z,Path(td)/'out')
              assert root.name=='EFI',root
              assert (root/'OC/config.plist').is_file()
          print('ZIP_EXTRACTION_AND_EFI_ROOT=PASS')
          PY
      - name: Validate the exact published Actions artifact with the deployment code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15068460589/zip \
            -o actual-diagnostic-artifact.zip
          echo "f2107eb0de11e94a2fd61ed0cee0c63e37943b1150f277777ae21bb6880bcd0f  actual-diagnostic-artifact.zip" | sha256sum --check
          python - <<'PY'
          import importlib.util, tempfile
          from pathlib import Path
          p=Path('B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py')
          spec=importlib.util.spec_from_file_location('deployer',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              efi=m.safe_extract(Path('actual-diagnostic-artifact.zip'),Path(td)/'extract')
              count=m.verify_efi(efi)
              assert efi.name=='EFI',efi
              print('ACTUAL_ARTIFACT_SAFE_EXTRACT=PASS')
              print('ACTUAL_ARTIFACT_EFI_VALIDATION=PASS; FILES='+str(count))
          PY

      - name: Validate the exact deployable EFI with official OpenCore 1.0.5 tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \\
            https://github.com/acidanthera/OpenCorePkg/releases/download/1.0.5/OpenCore-1.0.5-DEBUG.zip \\
            -o OpenCore-1.0.5-DEBUG.zip
          echo "db0720000455502b34ad5a0fc53114f7cd6d388bc6af7636e8a530276a6bf0a1  OpenCore-1.0.5-DEBUG.zip" | sha256sum --check
          mkdir official-oc105
          unzip -q OpenCore-1.0.5-DEBUG.zip -d official-oc105
          validator="$(find official-oc105 -type f -name ocvalidate.linux -print -quit)"
          official_driver="$(find official-oc105 -type f -path '*/X64/EFI/OC/Drivers/OpenUsbKbDxe.efi' -print -quit)"
          test -n "$validator" && test -n "$official_driver"
          chmod +x "$validator"
          python - <<'PY'
          import hashlib, importlib.util, plistlib, tempfile
          from pathlib import Path
          p=Path('B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py')
          spec=importlib.util.spec_from_file_location('deployer',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              efi=m.safe_extract(Path('actual-diagnostic-artifact.zip'),Path(td)/'extract')
              m.verify_efi(efi)
              oc=efi/'OC'
              cfg=plistlib.loads((oc/'config.plist').read_bytes())
              assert cfg['UEFI']['Input']['KeySupport'] is False
              assert cfg['UEFI'].get('ConnectDrivers') is True
              drivers=cfg['UEFI']['Drivers']
              assert sum(d.get('Path')=='OpenUsbKbDxe.efi' and d.get('Enabled') is True for d in drivers)==1
              assert not any(d.get('Path')=='Ps2KeyboardDxe.efi' and d.get('Enabled') for d in drivers)
              for d in drivers:
                  if d.get('Enabled'): assert (oc/'Drivers'/d['Path']).is_file(),d['Path']
              for a in cfg['ACPI']['Add']:
                  if a.get('Enabled'): assert (oc/'ACPI'/a['Path']).is_file(),a['Path']
              for k in cfg['Kernel']['Add']:
                  if k.get('Enabled'): assert (oc/'Kexts'/k['BundlePath']).exists(),k['BundlePath']
              h=lambda x: hashlib.sha256(x.read_bytes()).hexdigest()
              assert h(oc/'Drivers/OpenUsbKbDxe.efi')==h(Path('$official_driver')), 'OpenUsbKbDxe differs from official 1.0.5 release'
              print('ARTIFACT_CONFIG_AND_ALL_ENABLED_PATHS=PASS')
              print('OFFICIAL_OPENUSBKBD_BINARY_HASH=PASS')
          PY
          config="$(find /tmp -type f -path '*/EFI/OC/config.plist' -print -quit)"
          # Re-extract into a stable path for the official validator.
          mkdir -p official-validation
          unzip -q actual-diagnostic-artifact.zip -d official-validation
          config="$(find official-validation -type f -path '*/EFI/OC/config.plist' -print -quit)"
          test -n "$config"
          "$validator" "$config"
          echo "EXACT_DEPLOYABLE_ARTIFACT_OFFICIAL_OCVALIDATE_1_0_5=PASS"
