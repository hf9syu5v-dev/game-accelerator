name: Validate OpenCore 1.0.5 OpenUsbKbDxe deployment safety

on:
  workflow_dispatch:
  push:
    branches:
      - opencore-1.0.5-sequoia-rx570
    paths:
      - "B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py"
      - "B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.ps1"
      - ".github/workflows/validate-b460m-oc105-openusbkbd-deploy.yml"

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows PowerShell 5.1 parser validation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=(Resolve-Path 'B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.ps1').Path
          $t=$null; $e=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$t,[ref]$e) | Out-Null
          if ($e.Count) { $e | Format-List | Out-String | Write-Error }
          'POWERSHELL_5_1_PARSE=PASS'
      - name: Python syntax and safety-boundary audit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p='B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py'
          $s=Get-Content -LiteralPath $p -Raw
          python -m py_compile $p
          foreach($x in @('000000123ADC','LITEON I T LCS-128L9S','128035676160','Get-Partition','Get-Disk','IsBoot','IsSystem','com.apple.recovery.boot','BaseSystem.dmg','BaseSystem.chunklist','KeySupport','OpenUsbKbDxe.efi','EXPECTED_SHA256','EFI-PREVIOUS-OPENUSBKBD105')) {
            if (!$s.Contains($x)) { throw "Missing required guard: $x" }
          }
          foreach($x in @('Clear-Disk','Initialize-Disk','New-Partition','Remove-Partition','Format-Volume','Set-Partition','Set-Disk','diskpart','clean all')) {
            if ($s.Contains($x)) { throw "Forbidden destructive operation token: $x" }
          }
          'PYTHON_SYNTAX=PASS'
          'USB_IDENTITY_AND_RECOVERY_GUARDS=PASS'
          'NO_PARTITION_OR_FORMAT_OPERATIONS=PASS'
      - name: Exercise ZIP extraction and EFI root detection with fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util, tempfile, zipfile
          from pathlib import Path
          p=Path('B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py')
          spec=importlib.util.spec_from_file_location('deployer',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              z=Path(td)/'fixture.zip'
              with zipfile.ZipFile(z,'w') as a:
                  a.writestr('EFI/OC/config.plist',b'fixture')
              root=m.safe_extract(z,Path(td)/'out')
              assert root.name=='EFI',root
              assert (root/'OC/config.plist').is_file()
          print('ZIP_EXTRACTION_AND_EFI_ROOT=PASS')
          PY
      - name: Validate the exact published Actions artifact with the deployment code
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15068460589/zip \
            -o actual-diagnostic-artifact.zip
          echo "f2107eb0de11e94a2fd61ed0cee0c63e37943b1150f277777ae21bb6880bcd0f  actual-diagnostic-artifact.zip" | sha256sum --check
          python - <<'PY'
          import importlib.util, tempfile
          from pathlib import Path
          p=Path('B460M-OC-Builder/Deploy-B460M-OC105-OpenUsbKbDxe-Diagnostic.py')
          spec=importlib.util.spec_from_file_location('deployer',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          with tempfile.TemporaryDirectory() as td:
              efi=m.safe_extract(Path('actual-diagnostic-artifact.zip'),Path(td)/'extract')
              count=m.verify_efi(efi)
              assert efi.name=='EFI',efi
              print('ACTUAL_ARTIFACT_SAFE_EXTRACT=PASS')
              print('ACTUAL_ARTIFACT_EFI_VALIDATION=PASS; FILES='+str(count))
          PY
