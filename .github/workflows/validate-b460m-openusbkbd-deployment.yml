name: Validate B460M OpenUsbKbDxe Python deployment

on:
  push:
    paths:
      - "B460M-OC-Builder/Deploy-B460M-OpenUsbKbDxe-Keyboard-Diagnostic.py"
      - "B460M-OC-Builder/Deploy-B460M-OpenUsbKbDxe-Keyboard-Diagnostic-Contents.ps1"
      - ".github/workflows/validate-b460m-openusbkbd-deployment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax and static safety audit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $py = 'B460M-OC-Builder/Deploy-B460M-OpenUsbKbDxe-Keyboard-Diagnostic.py'
          $ps = 'B460M-OC-Builder/Deploy-B460M-OpenUsbKbDxe-Keyboard-Diagnostic-Contents.ps1'
          python -m py_compile $py
          $source = Get-Content -LiteralPath $py -Raw
          $launcher = Get-Content -LiteralPath $ps -Raw
          foreach ($forbidden in @('Clear-Disk','Initialize-Disk','New-Partition','Remove-Partition','Format-Volume','Set-Partition','Set-Disk','diskpart','clean all','format.com')) {
            if ($source.Contains($forbidden) -or $launcher.Contains($forbidden)) { throw "Forbidden destructive command token: $forbidden" }
          }
          foreach ($required in @('000000123ADC','LITEON I T LCS-128L9S','128035676160','Get-Partition','Get-Disk','IsBoot','IsSystem','relative_to','sha256','BACKUP','RECOVERY')) {
            if (!$source.Contains($required)) { throw "Missing safety/validation requirement: $required" }
          }
          if (!$launcher.Contains('RunAsAdministrator') -or !$launcher.Contains('LASTEXITCODE')) { throw 'PowerShell launcher privilege/exit checks missing.' }
          'PYTHON_SYNTAX=PASS'
          'STATIC_DESTRUCTIVE_OPERATION_SCAN=PASS'
          'USB_IDENTITY_GUARDS=PASS'

      - name: Python self-test (ZIP, staging, hashes, swap and rollback)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python 'B460M-OC-Builder/Deploy-B460M-OpenUsbKbDxe-Keyboard-Diagnostic.py' --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Python self-test failed.' }

      - name: Pinned EFI artifact validation and staging simulation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/hf9syu5v-dev/game-accelerator/releases/download/b460m-openusbkbd-keyboard-diagnostic/B460M-OpenUsbKbDxe-Keyboard-Diagnostic-EFI.zip'
          $zip = Join-Path $env:TEMP 'B460M-OpenUsbKbDxe-pinned.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          python 'B460M-OC-Builder/Deploy-B460M-OpenUsbKbDxe-Keyboard-Diagnostic.py' --validate-artifact $zip
          if ($LASTEXITCODE -ne 0) { throw 'Pinned artifact validation failed.' }
